
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Image Gallery</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:rgb(49, 177, 212);
      padding:20px;
    }

    h1{
      font-style: italic;
      font: size 85px;;
      text-align:center;
      margin-bottom:20px;
      color:rgb(225, 218, 218);
    }

    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:15px;
    }

    .gallery img{
      width:100%;
      height:220px;
      object-fit:cover;
      cursor:pointer;
      transition:0.4s;
    }

    .gallery img:hover{
      transform:scale(1.05);
      filter:brightness(80%);
    }

    /* Lightbox */

    .lightbox{
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.9);
      justify-content:center;
      align-items:center;
      z-index:1000;
    }

    .lightbox img{
      width:80%;
      max-width:700px;
      border-radius:10px;
    }

    .close{
      position:absolute;
      top:20px;
      right:30px;
      color:white;
      font-size:35px;
      cursor:pointer;
    }

    .prev, .next{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      color:white;
      font-size:40px;
      cursor:pointer;
      padding:10px;
      user-select:none;
    }

    .prev{
      left:20px;
    }

    .next{
      right:20px;
    }

    @media(max-width:600px){
      .lightbox img{
        width:95%;
      }
    }
  </style>
</head>

<body>

  <h1>Image Gallery</h1>

  <div class="gallery">
    <img src="https://picsum.photos/id/1015/600/400" alt="">
    <img src="https://picsum.photos/id/1016/600/400" alt="">
    <img src="https://picsum.photos/id/1018/600/400" alt="">
    <img src="https://picsum.photos/id/1020/600/400" alt="">
    <img src="https://picsum.photos/id/1024/600/400" alt="">
    <img src="https://picsum.photos/id/1035/600/400" alt="">
  </div>

  <!-- Lightbox -->

  <div class="lightbox" id="lightbox">
    <span class="close">&times;</span>
    <span class="prev">&#10094;</span>

    <img id="lightbox-img" src="">

    <span class="next">&#10095;</span>
  </div>

  <script>
    const images = document.querySelectorAll('.gallery img');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const closeBtn = document.querySelector('.close');
    const prevBtn = document.querySelector('.prev');
    const nextBtn = document.querySelector('.next');

    let currentIndex = 0;

    // Open Lightbox
    images.forEach((img, index) => {
      img.addEventListener('click', () => {
        currentIndex = index;
        showImage();
        lightbox.style.display = 'flex';
      });
    });

    // Show Image
    function showImage() {
      lightboxImg.src = images[currentIndex].src;
    }

    // Next Image
    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % images.length;
      showImage();
    });

    // Previous Image
    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      showImage();
    });

    // Close Lightbox
    closeBtn.addEventListener('click', () => {
      lightbox.style.display = 'none';
    });

    // Close when clicking outside image
    lightbox.addEventListener('click', (e) => {
      if(e.target !== lightboxImg &&
         e.target !== nextBtn &&
         e.target !== prevBtn){
        lightbox.style.display = 'none';
      }
    });

    // Keyboard Support
    document.addEventListener('keydown', (e) => {
      if(lightbox.style.display === 'flex'){

        if(e.key === 'ArrowRight'){
          currentIndex = (currentIndex + 1) % images.length;
          showImage();
        }

        if(e.key === 'ArrowLeft'){
          currentIndex = (currentIndex - 1 + images.length) % images.length;
          showImage();
        }

        if(e.key === 'Escape'){
          lightbox.style.display = 'none';
        }
      }
    });
  </script>

</body>
</html>
